name: PR76 hit-test evidence
on:
  push:
    branches: [agent/submission-continuity-hardening]
permissions:
  contents: read
jobs:
  hit-test:
    if: github.event.head_commit.message == 'run PR76 firmware-geometry candidate'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps webkit
      - name: Restore Trial Truth firmware geometry in test only
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('e2e/webkit-hit-test-diagnostic.spec.ts')
          text = path.read_text()
          old = "[data-oracle-machine][data-cassette-variant='trial-truth'] {\n        pointer-events: none !important;\n      }"
          new = "[data-oracle-machine][data-cassette-variant='trial-truth'] [data-oracle-trial-truth-firmware] {\n        position: absolute !important;\n        inset: 0 !important;\n        width: auto !important;\n        height: auto !important;\n      }"
          if text.count(old) != 1:
              raise SystemExit('Expected exact machine candidate once.')
          path.write_text(text.replace(old, new))
          PY
      - name: Run two hit-test diagnostics
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: hit-test-results.json
        run: npx playwright test e2e/webkit-hit-test-diagnostic.spec.ts --project=mobile-webkit --reporter=github,json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr76-hit-test-results
          path: hit-test-results.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr76-hit-test-evidence
          path: test-results
