name: PR76 targeted A WebKit

on:
  push:
    branches:
      - agent/submission-continuity-hardening

permissions:
  contents: write

jobs:
  targeted-a:
    if: github.event.head_commit.message == 'run six bounded PR76 A WebKit tests'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/submission-continuity-hardening
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
      - name: Verify exact remote head
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch origin agent/submission-continuity-hardening
          test "$(git rev-parse origin/agent/submission-continuity-hardening)" = "$GITHUB_SHA"
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps webkit
      - name: Six stale-contract Mobile WebKit tests
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: targeted-a-results.json
        run: >-
          npx playwright test
          e2e/first-trial-ingestion.spec.ts
          e2e/golden-path.spec.ts
          --project=mobile-webkit
          --grep "one Oracle instrument accepts|all supported widths|complete Phase B.5 golden path"
          --reporter=github,json
      - name: Upload targeted result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr76-targeted-a-results
          path: targeted-a-results.json
          if-no-files-found: error
      - name: Remove one-shot targeted workflow
        if: always()
        run: |
          set -euo pipefail
          git fetch origin agent/submission-continuity-hardening
          test "$(git rev-parse origin/agent/submission-continuity-hardening)" = "$GITHUB_SHA"
          rm .github/workflows/pr76-targeted-a.yml
          git config user.name "amydojo"
          git config user.email "amydojo@users.noreply.github.com"
          git add .github/workflows/pr76-targeted-a.yml
          git commit -m "remove one-shot PR76 targeted A runner"
          git push origin HEAD:agent/submission-continuity-hardening
