name: Apply result experience test migration

on:
  push:
    branches:
      - agent/result-experience

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.head_commit.message == 'Apply result experience test migration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/result-experience
          fetch-depth: 0
      - name: Update result experience expectations
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, count: int = 1) -> None:
              target = Path(path)
              text = target.read_text()
              if old not in text:
                  raise SystemExit(f'Expected source block not found in {path}: {old[:120]!r}')
              target.write_text(text.replace(old, new, count))

          replace(
              'src/features/evidence-record/resultExperienceViewModel.ts',
              "    verdict: record.finding,",
              "    verdict:\n      direction === 'favorable'\n        ? 'Favorable direction'\n        : direction === 'unfavorable'\n          ? 'Unfavorable direction'\n          : direction === 'unchanged'\n            ? 'No detected change'\n            : record.finding,",
          )

          replace(
              'src/features/evidence-record/EvidenceRecord.tsx',
              "import type { EvidenceRecordData } from '../../domain/model';",
              "import { oracleSpecimenIdentityFromEvidenceRecord } from '../../adapters/product/specimenFromRegisteredProduct';\nimport type { EvidenceRecordData } from '../../domain/model';",
          )
          replace(
              'src/features/evidence-record/EvidenceRecord.tsx',
              "  void onArchive;\n  const viewModel = resultExperienceViewModelFromRecord(record);",
              "  void onArchive;\n  const specimenIdentity = oracleSpecimenIdentityFromEvidenceRecord(record);\n  const viewModel = resultExperienceViewModelFromRecord(record);",
          )
          replace(
              'src/features/evidence-record/EvidenceRecord.tsx',
              "      data-record-id={viewModel.recordId}\n      data-snapshot-kind={viewModel.canonical ? 'canonical' : 'legacy'}",
              "      data-fv-screen=\"saved-result\"\n      data-record-id={viewModel.recordId}\n      data-snapshot-kind={viewModel.canonical ? 'canonical' : 'legacy'}\n      data-specimen-id={specimenIdentity.productId ?? ''}\n      data-specimen-accession={specimenIdentity.accession ?? ''}\n      data-specimen-brand={specimenIdentity.brand}\n      data-specimen-product={specimenIdentity.productName}\n      data-specimen-strength={specimenIdentity.strength ?? ''}\n      data-specimen-volume={specimenIdentity.volume ?? ''}",
          )

          replace(
              'src/test/evidence-record.test.tsx',
              "    expect(screen.getByText(evaluation.interpretation.finding)).toBeVisible();",
              "    expect(screen.getByText('Favorable direction')).toBeVisible();",
          )
          replace(
              'src/test/evidence-record.test.tsx',
              "  it('supports Escape, backdrop, swipe, and focus trapping without leaving the record', async () => {",
              "  it('supports Escape, backdrop dismissal, and focus trapping without leaving the record', async () => {",
          )
          replace(
              'src/test/evidence-record.test.tsx',
              "\n    const dialog = await openEvidence(user);\n    fireEvent.pointerDown(dialog, { clientY: 180 });\n    fireEvent.pointerUp(dialog, { clientY: 300 });\n    expect(screen.queryByRole('dialog', { name: 'Evidence' })).not.toBeInTheDocument();",
              "",
          )

          old_demo = """  it.each([
    ['saved_result', 'false', 'false', false],
    ['evidence_record_reasoning_expanded', 'true', 'false', false],
    ['evidence_record_full_technical_expanded', 'false', 'true', true],
  ] as const)(
    'opens %s through the real production Evidence Record',
    (startingPoint, whyExpanded, fullExpanded, technicalExpanded) => {
      const state = buildDemoFixtureState(startingPoint, 'clear_favorable_change');
      const record = state.record;
      if (!record?.rednessEvaluation) {
        throw new Error('Expected a saved canonical demo record.');
      }
      const snapshotBeforeRender = structuredClone(record.rednessEvaluation);
      const verdict = verdictViewModelFromRecord(record);

      render(
        <FaceValueContext.Provider
          value={{
            state,
            dispatch: vi.fn(),
            demoRuntime: {
              mode: 'preview',
              startingPoint,
              resultFixture: 'clear_favorable_change',
              fixtureNow: null,
            },
          }}
        >
          <FaceValueApplication />
        </FaceValueContext.Provider>,
      );

      expect(screen.getByRole('heading', { name: 'Evidence record' })).toBeVisible();
      expect(screen.getAllByText(verdict.headline).length).toBeGreaterThan(0);
      expect(
        screen.getByRole('button', { name: /Why Face Value reached this result/i }),
      ).toHaveAttribute('aria-expanded', whyExpanded);
      expect(screen.getByRole('button', { name: /Full evidence record/i })).toHaveAttribute(
        'aria-expanded',
        fullExpanded,
      );
      if (technicalExpanded) {
        expect(screen.getByText('Technical metadata').closest('details')).toHaveAttribute(
          'open',
        );
        expect(screen.getAllByText('Configuration hash')).toHaveLength(2);
      }
      expect(screen.getByRole('button', { name: 'View previous trials' })).toBeVisible();
      expect(record.rednessEvaluation).toEqual(snapshotBeforeRender);
    },
  );
"""
          new_demo = """  it.each([
    ['saved_result', 'result'],
    ['evidence_record_reasoning_expanded', 'evidence'],
    ['evidence_record_full_technical_expanded', 'provider'],
  ] as const)(
    'opens %s through the real production result experience',
    (startingPoint, expectedLayer) => {
      const state = buildDemoFixtureState(startingPoint, 'clear_favorable_change');
      const record = state.record;
      if (!record?.rednessEvaluation) {
        throw new Error('Expected a saved canonical demo record.');
      }
      const snapshotBeforeRender = structuredClone(record.rednessEvaluation);

      render(
        <FaceValueContext.Provider
          value={{
            state,
            dispatch: vi.fn(),
            demoRuntime: {
              mode: 'preview',
              startingPoint,
              resultFixture: 'clear_favorable_change',
              fixtureNow: null,
            },
          }}
        >
          <FaceValueApplication />
        </FaceValueContext.Provider>,
      );

      expect(screen.getByLabelText('Face Value saved result')).toHaveAttribute(
        'data-current-layer',
        expectedLayer,
      );
      if (expectedLayer === 'result') {
        expect(screen.getByRole('heading', { name: 'Visible redness' })).toBeVisible();
        expect(screen.getByRole('button', { name: 'View evidence' })).toBeVisible();
      } else if (expectedLayer === 'evidence') {
        expect(screen.getByRole('dialog', { name: 'Evidence' })).toBeVisible();
      } else {
        expect(screen.getByRole('heading', { name: 'Provider details' })).toBeVisible();
        expect(screen.getByText('Baseline median')).toBeVisible();
      }
      expect(record.rednessEvaluation).toEqual(snapshotBeforeRender);
    },
  );
"""
          replace('src/test/demo-lab.test.tsx', old_demo, new_demo)

          replace(
              'src/test/phase-b5-components.test.tsx',
              "  expect(screen.getByRole('heading', { name: 'Evidence record' })).toBeVisible();",
              "  expect(screen.getByRole('heading', { name: 'Visible redness' })).toBeVisible();",
          )
          replace(
              'src/test/phase-b5-components.test.tsx',
              "  expect(screen.getByRole('heading', { name: 'Test longer' })).toBeVisible();",
              "  expect(screen.getByRole('button', { name: 'View evidence' })).toBeVisible();",
          )

          replace(
              'e2e/evidence-record.spec.ts',
              "    const { snapshot } = await openSnapshot(page);",
              "    await openSnapshot(page);",
          )
          replace(
              'e2e/evidence-record.spec.ts',
              "    await expect(page.getByText(snapshot.interpretation.finding)).toBeVisible();",
              "    await expect(page.getByText('Favorable direction', { exact: true })).toBeVisible();",
          )
          replace(
              'e2e/evidence-record.spec.ts',
              "  await expect(page.getByText(snapshot.interpretation.finding)).toBeVisible();",
              "  await expect(page.getByText('Favorable direction', { exact: true })).toBeVisible();",
          )

          workflow = Path('.github/workflows/apply-result-experience-test-migration.yml')
          workflow.unlink()
          PY
      - name: Commit migrated expectations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update UI tests for result experience"
          git push origin HEAD:agent/result-experience
