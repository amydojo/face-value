name: PR76 apply proven firmware geometry fix

on:
  push:
    branches:
      - agent/submission-continuity-hardening

permissions:
  contents: write

jobs:
  apply-proven-fix:
    if: github.event.head_commit.message == 'stage proven PR76 firmware geometry fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/submission-continuity-hardening
          fetch-depth: 0
      - name: Verify exact parent and live head
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "a88390a95dc7668308017339101156fece20248e"
          git fetch origin agent/submission-continuity-hardening
          test "$(git rev-parse origin/agent/submission-continuity-hardening)" = "$GITHUB_SHA"
      - name: Apply only the proven Trial Truth firmware geometry correction
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/styles/submission-physical-qa.css')
          text = path.read_text()
          old = """/* Trial Truth remains physically inside the Oracle chassis. Keep the interactive firmware above the already non-interactive texture/reflection layers without disabling its structural ancestors; WebKit must be able to hit-test the nested controls normally. */
          [data-oracle-machine][data-cassette-variant='trial-truth'] [data-oracle-trial-truth-firmware],
          [data-oracle-machine][data-cassette-variant='trial-truth']
            [data-oracle-trial-truth-firmware]
            [data-trial-truth-firmware-view] {
            z-index: 11 !important;
            pointer-events: auto;
          }
          """
          new = """/* Trial Truth remains physically inside the Oracle chassis. WebKit requires the interactive firmware wrapper to own the full glass geometry; a collapsed zero-height wrapper paints visibly but loses physical hit testing. */
          [data-oracle-machine][data-cassette-variant='trial-truth'] [data-oracle-trial-truth-firmware] {
            position: absolute !important;
            inset: 0 !important;
            z-index: 11 !important;
            width: auto !important;
            height: auto !important;
            pointer-events: auto;
          }

          [data-oracle-machine][data-cassette-variant='trial-truth']
            [data-oracle-trial-truth-firmware]
            [data-trial-truth-firmware-view] {
            z-index: 11 !important;
            pointer-events: auto;
          }
          """
          if text.count(old) != 1:
              raise SystemExit('Expected exact pre-fix Trial Truth CSS block once.')
          path.write_text(text.replace(old, new))
          Path('.github/workflows/pr76-apply-proven-firmware-fix.yml').unlink()
          PY
          git diff --check
          git diff -- src/styles/submission-physical-qa.css .github/workflows/pr76-apply-proven-firmware-fix.yml
      - name: Commit bounded production correction
        run: |
          set -euo pipefail
          git fetch origin agent/submission-continuity-hardening
          test "$(git rev-parse origin/agent/submission-continuity-hardening)" = "$GITHUB_SHA"
          git config user.name "amydojo"
          git config user.email "amydojo@users.noreply.github.com"
          git add src/styles/submission-physical-qa.css .github/workflows/pr76-apply-proven-firmware-fix.yml
          git commit -m "restore physical WebKit hit geometry for Trial Truth firmware"
          git push origin HEAD:agent/submission-continuity-hardening
