name: Apply Evidence Machine payload

on:
  push:
    branches:
      - feat/evidence-machine-signature-release
    paths:
      - '.github/evidence-machine-payload/**'
      - '.github/workflows/apply-evidence-machine-payload.yml'

permissions:
  contents: write

jobs:
  apply:
    if: "!contains(github.event.head_commit.message, '[payload applied]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/evidence-machine-signature-release
          fetch-depth: 0
      - name: Decode and apply implementation
        shell: bash
        run: |
          cat .github/evidence-machine-payload/part-* | base64 -d > /tmp/evidence-machine.tar.gz
          echo "abb312537a2b181cc44d515992d87c1767279ed57ced3d50aeb59864b73a175c  /tmp/evidence-machine.tar.gz" | sha256sum -c -
          tar -xzf /tmp/evidence-machine.tar.gz
          rm -rf .github/evidence-machine-payload
          rm -f .github/workflows/apply-evidence-machine-payload.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: build the operable Evidence Machine and signature record release [payload applied]"
          git push origin HEAD:feat/evidence-machine-signature-release
