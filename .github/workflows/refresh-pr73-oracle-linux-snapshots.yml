name: Refresh PR73 Oracle Linux snapshots

on:
  push:
    branches:
      - agent/actuator-v1-1
    paths:
      - .github/workflows/refresh-pr73-oracle-linux-snapshots.yml

permissions:
  contents: write

concurrency:
  group: refresh-pr73-oracle-linux-snapshots
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event.head_commit.message == 'chore: stage PR73 Oracle Linux snapshot refresh'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install WebKit
        run: npx playwright install --with-deps webkit

      - name: Refresh only approved V1.1 Oracle references
        run: >-
          npm run test:e2e -- e2e/oracle-reveal.spec.ts
          --project=mobile-webkit
          --grep 'canonical visual states|opaque square paper|clean reduced-motion'
          --update-snapshots

      - name: Verify bounded snapshot output
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            'e2e/oracle-reveal.spec.ts-snapshots/oracle-transmitting-mobile-webkit-linux.png'
            'e2e/oracle-reveal.spec.ts-snapshots/oracle-committing-mobile-webkit-linux.png'
            'e2e/oracle-reveal.spec.ts-snapshots/oracle-dispensing-mobile-webkit-linux.png'
            'e2e/oracle-reveal.spec.ts-snapshots/oracle-paper-registration-mobile-webkit-linux.png'
            'e2e/oracle-reveal.spec.ts-snapshots/oracle-dispense-midpoint-mobile-webkit-linux.png'
            'e2e/oracle-reveal.spec.ts-snapshots/oracle-dispense-midpoint-reduced-mobile-webkit-linux.png'
          )
          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -eq "${#expected[@]}"
          for path in "${expected[@]}"; do
            printf '%s\n' "${changed[@]}" | grep -Fx -- "$path" >/dev/null
          done

      - name: Commit exact CI references
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin refs/heads/agent/actuator-v1-1 | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            e2e/oracle-reveal.spec.ts-snapshots/oracle-transmitting-mobile-webkit-linux.png \
            e2e/oracle-reveal.spec.ts-snapshots/oracle-committing-mobile-webkit-linux.png \
            e2e/oracle-reveal.spec.ts-snapshots/oracle-dispensing-mobile-webkit-linux.png \
            e2e/oracle-reveal.spec.ts-snapshots/oracle-paper-registration-mobile-webkit-linux.png \
            e2e/oracle-reveal.spec.ts-snapshots/oracle-dispense-midpoint-mobile-webkit-linux.png \
            e2e/oracle-reveal.spec.ts-snapshots/oracle-dispense-midpoint-reduced-mobile-webkit-linux.png
          git commit -m 'test: refresh approved PR73 Oracle Linux snapshots'
          git push origin HEAD:agent/actuator-v1-1
