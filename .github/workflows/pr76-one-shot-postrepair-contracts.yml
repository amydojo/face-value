name: PR76 post-repair contract proof

on:
  push:
    branches:
      - agent/submission-continuity-hardening

permissions:
  contents: write

jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/submission-continuity-hardening
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
      - name: Verify bounded invocation
        run: |
          set -euo pipefail
          test "$(git log -1 --pretty=%s)" = "run PR76 post-repair contract proof"
          test "$(git rev-parse HEAD^)" = "efbd6cb5db5ec46f1bb4d103dfe6096c398eb440"
          test "$(git rev-parse HEAD~2)" = "f21e08e25a6442e12399616d1cad7adb57f0bff2"
          git fetch origin agent/submission-continuity-hardening
          test "$(git rev-parse origin/agent/submission-continuity-hardening)" = "$GITHUB_SHA"
      - name: Apply evidence-backed test contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('e2e/first-trial-ingestion.spec.ts')
          s = p.read_text()
          stale = "expect(await machineDocumentGeometry(page)).toEqual(workflowMachineGeometry);"
          if s.count(stale) != 6:
              raise SystemExit(f'expected 6 stale geometry assertions, found {s.count(stale)}')
          first = """  expect(await machineDocumentGeometry(page)).toEqual(workflowMachineGeometry);

  await page.clock.runFor(registrationTiming.preparingCheckpoint);"""
          new_first = """  const operationalMachineGeometry = await machineDocumentGeometry(page);
  expect(operationalMachineGeometry.x).toBe(workflowMachineGeometry.x);
  expect(operationalMachineGeometry.width).toBe(workflowMachineGeometry.width);
  expect(operationalMachineGeometry.height).toBe(workflowMachineGeometry.height);
  expect(operationalMachineGeometry.transform).toBe(workflowMachineGeometry.transform);
  expect(operationalMachineGeometry.animationName).toBe(workflowMachineGeometry.animationName);
  expect(operationalMachineGeometry.documentY).toBeGreaterThan(workflowMachineGeometry.documentY);
  expect(operationalMachineGeometry.viewportY).toBeGreaterThan(workflowMachineGeometry.viewportY);

  await page.clock.runFor(registrationTiming.preparingCheckpoint);"""
          if s.count(first) != 1:
              raise SystemExit('first geometry assertion block changed')
          s = s.replace(first, new_first)
          if s.count(stale) != 5:
              raise SystemExit('operational geometry assertion count changed')
          s = s.replace(stale, "expect(await machineDocumentGeometry(page)).toEqual(operationalMachineGeometry);")
          old_ev = """          workflowMachine: workflowMachineGeometry,
          workflowLayout: registrationLayout,
          stableMachinePhases: [
            'registration-preview',
            'preparing',"""
          new_ev = """          registrationPreviewMachine: workflowMachineGeometry,
          operationalMachine: operationalMachineGeometry,
          workflowLayout: registrationLayout,
          stableMachinePhases: [
            'preparing',"""
          if s.count(old_ev) != 1:
              raise SystemExit('geometry evidence block changed')
          p.write_text(s.replace(old_ev, new_ev))

          p = Path('e2e/golden-path.spec.ts')
          s = p.read_text()
          old = "    await expect(page.getByLabel('Result recommendation').locator(':scope > p')).toBeVisible();"
          new = "    await expect(page.getByLabel('Result recommendation').locator(':scope > p')).toBeHidden();"
          if s.count(old) != 1:
              raise SystemExit('legacy recommendation assertion changed')
          p.write_text(s.replace(old, new))
          PY
          git diff --check
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps webkit
      - name: Five targeted Mobile WebKit contracts
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: postrepair-targeted.json
        run: npx playwright test e2e/first-trial-ingestion.spec.ts e2e/golden-path.spec.ts --project=mobile-webkit --grep "one Oracle instrument accepts, loads, and releases one specimen to baseline|complete Phase B.5 golden path" --reporter=github,json
      - name: Upload proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr76-postrepair-targeted-results
          path: postrepair-targeted.json
          if-no-files-found: warn
      - name: Commit proven contracts and remove runner
        run: |
          set -euo pipefail
          git fetch origin agent/submission-continuity-hardening
          test "$(git rev-parse origin/agent/submission-continuity-hardening)" = "$GITHUB_SHA"
          rm .github/workflows/pr76-one-shot-postrepair-contracts.yml
          git config user.name "amydojo"
          git config user.email "amydojo@users.noreply.github.com"
          git add e2e/first-trial-ingestion.spec.ts e2e/golden-path.spec.ts .github/workflows/pr76-one-shot-postrepair-contracts.yml
          git commit -m "align post-repair WebKit contracts with approved continuity"
          git push origin HEAD:agent/submission-continuity-hardening
