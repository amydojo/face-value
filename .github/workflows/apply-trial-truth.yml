name: Apply trial truth implementation

on:
  push:
    branches:
      - agent/redness-trial-truth-lite
    paths:
      - '.github/trial-truth-payload/**'
      - '.github/workflows/apply-trial-truth.yml'
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

concurrency:
  group: apply-trial-truth-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/redness-trial-truth-lite
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Decode and patch applicator transport
        run: |
          cat .github/trial-truth-payload/part-* | base64 --decode | gzip --decompress > /tmp/apply-trial-truth.mjs
          python - <<'PY'
          from pathlib import Path
          path = Path('/tmp/apply-trial-truth.mjs')
          source = path.read_text()
          replacements = [
              (
                  'YWN0aXZlUmVkbmVzc0J1cnN0OiBudWxsLAphbm5vdW5jZW1lbnQ6IG9wdGlvbnMuc3ludGhldGljCg==',
                  'YWN0aXZlUmVkbmVzc0J1cnN0OiBudWxsLAogICAgYW5ub3VuY2VtZW50OiBvcHRpb25zLnN5bnRoZXRpYwo=',
              ),
              (
                  'YWN0aXZlUmVkbmVzc0J1cnN0OiBudWxsLAp0cmlhbFRydXRoRXZpZGVuY2U6IHBlcnNpc3RlZC50cmlhbFRydXRoRXZpZGVuY2UsCnRyaWFsVHJ1dGhWYWxpZGF0aW9uOiBudWxsLAphbm5vdW5jZW1lbnQ6IG9wdGlvbnMuc3ludGhldGljCg==',
                  'YWN0aXZlUmVkbmVzc0J1cnN0OiBudWxsLAogICAgdHJpYWxUcnV0aEV2aWRlbmNlOiBwZXJzaXN0ZWQudHJpYWxUcnV0aEV2aWRlbmNlLAogICAgdHJpYWxUcnV0aFZhbGlkYXRpb246IG51bGwsCiAgICBhbm5vdW5jZW1lbnQ6IG9wdGlvbnMuc3ludGhldGljCg==',
              ),
              (
                  'ewogIGlkOiAnY29tcGFyaXNvbl9wcm9jZXNzaW5nJywK',
                  'ewogICAgaWQ6ICdjb21wYXJpc29uX3Byb2Nlc3NpbmcnLAo=',
              ),
              (
                  'ewogIGlkOiAndHJpYWxfdHJ1dGgnLAogIGxhYmVsOiAnVHJpYWwgdHJ1dGgnLAogIGRlc2NyaXB0aW9uOiAnT3BlbiB0aGUgcmVxdWlyZWQgZXZpZGVuY2UgY2hlY2twb2ludCBhZnRlciBmb2xsb3ctdXAgaXMgc2VjdXJlZC4nLAogIGZyZXF1ZW50OiBmYWxzZSwKfSwKewogIGlkOiAnY29tcGFyaXNvbl9wcm9jZXNzaW5nJywK',
                  'ewogICAgaWQ6ICd0cmlhbF90cnV0aCcsCiAgICBsYWJlbDogJ1RyaWFsIHRydXRoJywKICAgIGRlc2NyaXB0aW9uOiAnT3BlbiB0aGUgcmVxdWlyZWQgZXZpZGVuY2UgY2hlY2twb2ludCBhZnRlciBmb2xsb3ctdXAgaXMgc2VjdXJlZC4nLAogICAgZnJlcXVlbnQ6IGZhbHNlLAogIH0sCiAgewogICAgaWQ6ICdjb21wYXJpc29uX3Byb2Nlc3NpbmcnLAo=',
              ),
          ]
          for old, new in replacements:
              source = source.replace(old, new)
          source = source.replace(
              'for (const [path, oldEncoded, newEncoded] of replacements) {',
              'const replacementErrors = [];\nfor (const [path, oldEncoded, newEncoded] of replacements) {',
          )
          source = source.replace(
              "  if (first < 0) throw new Error(`Missing exact replacement in ${path}: ${oldValue.slice(0, 100)}`);",
              "  if (first < 0) { replacementErrors.push(`Missing exact replacement in ${path}: ${oldValue.slice(0, 100)}`); continue; }",
          )
          source = source.replace(
              "  if (first !== last) throw new Error(`Ambiguous exact replacement in ${path}: ${oldValue.slice(0, 100)}`);",
              "  if (first !== last) { replacementErrors.push(`Ambiguous exact replacement in ${path}: ${oldValue.slice(0, 100)}`); continue; }",
          )
          source += "\nif (replacementErrors.length > 0) throw new Error(replacementErrors.join('\\n'));\n"
          path.write_text(source)
          PY
          node /tmp/apply-trial-truth.mjs
      - name: Format implementation
        run: |
          npx prettier --write \
            src/domain/trialTruth.ts \
            src/adapters/analysis/youcam/trialTruthEvidenceAdapter.ts \
            src/app/trialTruthMachine.ts \
            src/adapters/persistence/trialTruthObservationStore.ts \
            src/features/trial-truth \
            src/test/trial-truth.test.ts \
            src/test/trial-truth-surface.test.tsx \
            e2e/trial-truth.spec.ts \
            src/domain/model.ts \
            src/domain/evidence/redness/evaluateRedness.ts \
            src/app/faceValueContext.ts \
            src/app/FaceValueProvider.tsx \
            src/features/HumanButterProductionJourney.tsx \
            src/domain/demoLab.ts \
            src/adapters/persistence/demoJourneyStore.ts \
            src/features/demo-lab/demoFixtureState.ts \
            src/features/evidence-record/evidenceRecordViewModel.ts \
            scripts/verify-redness-architecture.mjs \
            docs/architecture.md \
            docs/state-model.md \
            docs/redness-evidence-engine-v1.md
      - run: npm run typecheck
      - run: npm run verify:redness-architecture
      - run: npm run test -- src/test/trial-truth.test.ts src/test/trial-truth-surface.test.tsx
      - name: Commit coherent implementation
        run: |
          rm -rf .github/trial-truth-payload
          rm .github/workflows/apply-trial-truth.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement trial truth evidence gate"
          git push origin HEAD:agent/redness-trial-truth-lite
