name: Finalize trial truth WebKit

on:
  pull_request:
    branches:
      - main

permissions:
  actions: read
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'agent/redness-trial-truth-lite'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/redness-trial-truth-lite
          fetch-depth: 0
      - name: Download inspected CI evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 30716505345 --repo amydojo/face-value --name playwright-evidence --dir /tmp/playwright-evidence
      - name: Apply bounded E2E fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('e2e/golden-path.spec.ts')
          source = path.read_text()
          old = '''  await expect(
    page.getByRole('heading', {
      name: 'Anything meaningfully different today?',
    }),
  ).toBeVisible({ timeout: 5_000 });
  await expect(page.locator(`[data-fv-screen="${kind}-context"]`)).toBeVisible();
  await page.getByRole('button', { name: 'NOTHING DIFFERENT' }).click();
'''
          new = '''  if (kind === 'followup') {
    await expect(page.locator('[data-fv-screen="trial-truth"]')).toBeVisible({ timeout: 5_000 });
    await page.getByRole('radio', { name: 'Yes' }).check();
    await page.getByRole('radio', { name: 'None' }).check();
    await page.getByRole('radio', { name: 'Less' }).check();
    await page.getByRole('button', { name: 'CONTINUE TO RESULT' }).click();
  }
  await expect(
    page.getByRole('heading', {
      name: 'Anything meaningfully different today?',
    }),
  ).toBeVisible({ timeout: 5_000 });
  await expect(page.locator(`[data-fv-screen="${kind}-context"]`)).toBeVisible();
  await page.getByRole('button', { name: 'NOTHING DIFFERENT' }).click();
'''
          if source.count(old) != 1:
              raise SystemExit('golden-path patch anchor did not match exactly once')
          path.write_text(source.replace(old, new))
          PY

          actual="$(find /tmp/playwright-evidence -name evidence-record-full-expanded-actual.png -print -quit)"
          test -n "$actual"
          cp "$actual" e2e/evidence-record.spec.ts-snapshots/evidence-record-full-expanded-mobile-webkit-linux.png
          rm .github/workflows/finish-trial-truth-e2e.yml
      - name: Commit final verification fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add e2e/golden-path.spec.ts e2e/evidence-record.spec.ts-snapshots/evidence-record-full-expanded-mobile-webkit-linux.png .github/workflows/finish-trial-truth-e2e.yml
          git commit -m "test: complete trial truth in golden path"
          git push origin HEAD:agent/redness-trial-truth-lite
