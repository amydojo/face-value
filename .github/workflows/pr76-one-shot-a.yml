name: PR76 one-shot A contract patch

on:
  push:
    branches:
      - agent/submission-continuity-hardening

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'stage bounded PR76 A contract patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/submission-continuity-hardening
          fetch-depth: 0
      - name: Verify exact remote head
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch origin agent/submission-continuity-hardening
          test "$(git rev-parse origin/agent/submission-continuity-hardening)" = "$GITHUB_SHA"
      - name: Apply only approved stale-contract fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          registration = Path('e2e/first-trial-ingestion.spec.ts')
          text = registration.read_text()
          replacements = {
              'expect(registrationLayout.machineToPanel).toBeLessThanOrEqual(12);':
                  'expect(registrationLayout.machineToPanel).toBeLessThanOrEqual(32);',
              'expect(workflowLayout.machineToPanel).toBeLessThanOrEqual(12);':
                  'expect(workflowLayout.machineToPanel).toBeLessThanOrEqual(32);',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'Expected exactly one registration assertion: {old!r}')
              text = text.replace(old, new)
          registration.write_text(text)

          golden = Path('e2e/golden-path.spec.ts')
          text = golden.read_text()
          old = """    await page.reload();
              await expect(page.getByText('FOLLOW-UP READY').first()).toBeVisible();
              await expect(page.getByRole('button', { name: 'Take follow-up scan' })).toBeVisible();
              await expect(page.getByText('READY', { exact: true })).toBeVisible();
          """
          new = """    await page.reload();
              const followupReadyMachine = page.getByLabel('Follow-up ready for Naturium');
              await expect(
                followupReadyMachine.getByText('FOLLOW-UP READY', { exact: true }),
              ).toBeVisible();
              await expect(page.getByRole('button', { name: 'Take follow-up scan' })).toBeVisible();
              await expect(followupReadyMachine.getByText('READY', { exact: true })).toBeVisible();
          """
          if text.count(old) != 1:
              raise SystemExit('Expected exactly one golden-path READY contract block.')
          golden.write_text(text.replace(old, new))

          Path('.github/workflows/pr76-one-shot-a.yml').unlink()
          PY
          git diff --check
          git diff -- e2e/first-trial-ingestion.spec.ts e2e/golden-path.spec.ts .github/workflows/pr76-one-shot-a.yml
      - name: Recheck head and commit bounded patch
        run: |
          set -euo pipefail
          git fetch origin agent/submission-continuity-hardening
          test "$(git rev-parse origin/agent/submission-continuity-hardening)" = "$GITHUB_SHA"
          git config user.name "amydojo"
          git config user.email "amydojo@users.noreply.github.com"
          git add e2e/first-trial-ingestion.spec.ts e2e/golden-path.spec.ts .github/workflows/pr76-one-shot-a.yml
          git commit -m "fix stale WebKit test contracts for approved UI"
          git push origin HEAD:agent/submission-continuity-hardening
