name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run verify:redness-architecture
      - run: npm run verify:docs
      - name: Unit and component tests
        run: npm run test -- --reporter=default --reporter=json --outputFile=vitest-results.json
      - name: Upload Vitest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-results
          path: vitest-results.json
          if-no-files-found: error
      - run: npm run build
      - name: Scan compiled client privacy
        run: |
          set -o pipefail
          npm run verify:privacy 2>&1 | tee privacy-results.txt
      - name: Upload privacy scan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: privacy-results
          path: privacy-results.txt
          if-no-files-found: error
      - name: Upload production bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-bundle
          path: dist
          if-no-files-found: error
      - run: npx playwright install --with-deps webkit
      - name: Refresh only approved Oracle dock references
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail

          npx playwright test e2e/oracle-reveal.spec.ts \
            --project=mobile-webkit \
            --grep "captures the canonical visual states without changing machine geometry|collection leaves an empty slot, detail is escapable, and Done restores home continuity" \
            --update-snapshots

          expected="$(printf '%s\n' \
            'e2e/oracle-reveal.spec.ts-snapshots/oracle-collected-empty-slot-mobile-webkit-linux.png' \
            'e2e/oracle-reveal.spec.ts-snapshots/oracle-collected-mobile-webkit-linux.png' \
            'e2e/oracle-reveal.spec.ts-snapshots/oracle-opening-mobile-webkit-linux.png' | sort)"
          actual="$(git diff --name-only -- e2e/oracle-reveal.spec.ts-snapshots | sort)"

          if [ "$actual" != "$expected" ]; then
            echo "Unexpected snapshot change set."
            echo "Expected:"
            printf '%s\n' "$expected"
            echo "Actual:"
            printf '%s\n' "$actual"
            exit 1
          fi

          git checkout HEAD^ -- .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml \
            e2e/oracle-reveal.spec.ts-snapshots/oracle-opening-mobile-webkit-linux.png \
            e2e/oracle-reveal.spec.ts-snapshots/oracle-collected-mobile-webkit-linux.png \
            e2e/oracle-reveal.spec.ts-snapshots/oracle-collected-empty-slot-mobile-webkit-linux.png
          git commit -m "test: refresh expanded Oracle dock references"
          git push origin "HEAD:${HEAD_BRANCH}"
      - run: npm run test:e2e
      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence
          path: test-results
          if-no-files-found: ignore