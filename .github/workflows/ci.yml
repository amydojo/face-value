name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit and component tests
        run: |
          npm run test -- --reporter=json --outputFile=vitest-results.json || true
          node --input-type=module -e "import fs from 'node:fs'; const report = JSON.parse(fs.readFileSync('vitest-results.json', 'utf8')); if (!report.success) process.exit(1); console.log(report.numPassedTests + '/' + report.numTotalTests + ' tests passed');"
      - name: Upload Vitest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-results
          path: vitest-results.json
          if-no-files-found: error
      - run: npm run build
      - run: npx playwright install --with-deps webkit
      - run: npm run test:e2e
      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence
          path: test-results
          if-no-files-found: ignore
