name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit and component tests
        run: npm run test -- --reporter=default --reporter=json --outputFile=vitest-results.json
      - name: Upload Vitest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-results
          path: vitest-results.json
          if-no-files-found: error
      - run: npm run build
      - name: Scan compiled client privacy
        run: |
          set -o pipefail
          npm run verify:privacy 2>&1 | tee privacy-results.txt
      - name: Upload privacy scan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: privacy-results
          path: privacy-results.txt
          if-no-files-found: error
      - name: Upload production bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-bundle
          path: dist
          if-no-files-found: error
      - run: npx playwright install --with-deps webkit
      - run: npm run test:e2e
      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence
          path: test-results
          if-no-files-found: ignore
