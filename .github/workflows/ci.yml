name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run verify:redness-architecture
      - run: npm run verify:docs
      - name: Unit and component tests
        run: npm run test -- --reporter=default --reporter=json --outputFile=vitest-results.json
      - name: Upload Vitest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-results
          path: vitest-results.json
          if-no-files-found: error
      - run: npm run build
      - name: Scan compiled client privacy
        run: |
          set -o pipefail
          npm run verify:privacy 2>&1 | tee privacy-results.txt
      - name: Upload privacy scan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: privacy-results
          path: privacy-results.txt
          if-no-files-found: error
      - name: Upload production bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-bundle
          path: dist
          if-no-files-found: error
      - run: npx playwright install --with-deps webkit
      - run: npm run test:e2e
      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence
          path: test-results
          if-no-files-found: ignore

  refresh-oracle-linux-snapshots:
    if: github.event.pull_request.head.ref == 'agent/redness-evidence-burst'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/redness-evidence-burst
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0

      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps webkit

      - name: Refresh Oracle Linux references
        run: npm run test:e2e -- e2e/oracle-reveal.spec.ts --project=mobile-webkit --update-snapshots

      - name: Verify bounded snapshot output
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            'e2e/oracle-reveal.spec.ts-snapshots/oracle-sealed-mobile-webkit-linux.png'
            'e2e/oracle-reveal.spec.ts-snapshots/oracle-opening-mobile-webkit-linux.png'
            'e2e/oracle-reveal.spec.ts-snapshots/oracle-collected-mobile-webkit-linux.png'
            'e2e/oracle-reveal.spec.ts-snapshots/oracle-collected-empty-slot-mobile-webkit-linux.png'
          )
          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -eq "${#expected[@]}"
          for path in "${expected[@]}"; do
            printf '%s\n' "${changed[@]}" | grep -Fx -- "$path" >/dev/null
          done

      - name: Commit exact CI references
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin refs/heads/agent/redness-evidence-burst | cut -f1)"
          test "$remote_head" = "${{ github.event.pull_request.head.sha }}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            e2e/oracle-reveal.spec.ts-snapshots/oracle-sealed-mobile-webkit-linux.png \
            e2e/oracle-reveal.spec.ts-snapshots/oracle-opening-mobile-webkit-linux.png \
            e2e/oracle-reveal.spec.ts-snapshots/oracle-collected-mobile-webkit-linux.png \
            e2e/oracle-reveal.spec.ts-snapshots/oracle-collected-empty-slot-mobile-webkit-linux.png
          git commit -m 'test: refresh Oracle Linux snapshots'
          git push origin HEAD:agent/redness-evidence-burst
