name: Patch Vercel function imports

on:
  push:
    branches:
      - feat/youcam-phase-a-live-score

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/youcam-phase-a-live-score
      - name: Add explicit ESM extensions for Vercel Functions
        run: |
          sed -i "s#'../src/adapters/analysis/youcam/contracts'#'../src/adapters/analysis/youcam/contracts.js'#" api/_youcam.ts
          sed -i "s#'../../src/adapters/analysis/youcam/contracts'#'../../src/adapters/analysis/youcam/contracts.js'#" api/youcam/task.ts api/youcam/upload-slot.ts
          sed -i "s#'../_youcam'#'../_youcam.js'#" api/youcam/task.ts api/youcam/upload-slot.ts
          rm .github/workflows/patch-vercel-imports.yml
      - name: Commit hardened imports
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add api/_youcam.ts api/youcam/task.ts api/youcam/upload-slot.ts .github/workflows/patch-vercel-imports.yml
          git commit -m "fix: harden Vercel function ESM imports"
          git push origin HEAD:feat/youcam-phase-a-live-score
